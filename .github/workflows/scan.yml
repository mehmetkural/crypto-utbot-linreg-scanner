name: Crypto Scanner (UT Bot + LinReg)

on:
  schedule:
        - cron: '7,22,37,52 * * * *'  # offset from :00/:15/:30/:45 to avoid GitHub Actions high-load queueing delays
  workflow_dispatch:
    inputs:
      test_notify:
        description: 'Force a generic test notification instead of a real signal scan'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --quiet pandas numpy requests matplotlib

      - name: Run scanner
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FORCE_TEST_NOTIFY: ${{ github.event.inputs.test_notify == 'true' && '1' || '' }}
        # Guclu sinyal bildirimi gonderilirken notify_state.json ve grafik gorseli
        # (latest_chart.png) scanner.py icinden otomatik commit+push edilir.
        run: python3 scanner.py

      - name: BTC kagit alim-satim (UT Bot Alerts, 100E, ana taramadan bagimsiz)
        # Ana taramadan tamamen ayri, bildirimsiz bir simulasyon: BTCUSDT'nin ayni
        # UT Bot Alerts sinyaliyle "buy" dedigi anda 100 EUR'luk hayali butcenin
        # tamami BTC alinmis, "sell" dedigi anda tamami satilmis gibi defter tutar
        # (bkz. btc_paper_trader.py). Kendi cikti/durum dosyalarini (btc_paper_trade.json,
        # btc_paper_trade_state.json) kendi icinden commit+push eder.
        run: python3 btc_paper_trader.py

      - name: Upload latest signals as artifact
        uses: actions/upload-artifact@v4
        with:
          name: latest-signals
          path: latest_signals.json
          retention-days: 7
